name: Release

# Once the tests pass on main, python-semantic-release reads the Conventional
# Commits since the last tag. When one calls for a release (feat: a minor
# version, fix: or perf: a patch, "!" or BREAKING CHANGE: a major one, a minor
# one while at 0.x) it writes the version into src/ic705suite/__init__.py and
# CHANGELOG.md, commits "chore(release): X.Y.Z", tags vX.Y.Z and pushes. Then
# the Linux and Windows executables of that tag are built, checked, packed with
# their installers and published as its GitHub release. The settings live in
# pyproject.toml ([tool.semantic_release]).
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  # By hand: a release from main now, or (with a tag) build and publish an
  # existing tag again, after a release that failed halfway.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish again (for example v0.2.0); empty for a new release from main"
        required: false
        default: ""

permissions:
  contents: write

# One release at a time, never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    name: Version
    # After tests that passed on a push to main (not on a pull request).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.meta.outputs.released }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # The whole history and its tags: the commits since the last release.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0

      # The tests ran on one commit; releasing a newer main would publish
      # untested code. Its own test run will release it.
      - name: The tested commit is still the tip of main
        id: tip
        if: github.event_name == 'workflow_run'
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED" ]; then
            echo "::notice::main has moved on since $TESTED; its own test run will release"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Next version, changelog, commit and tag
        id: release
        if: steps.tip.outputs.stale != 'true' && inputs.tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The GitHub release itself is made by the publish job, with the files.
          uvx --from python-semantic-release==10.7.0 semantic-release version --no-vcs-release

      - name: What to build
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASED: ${{ steps.release.outputs.released }}
          NEW_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [ "$RELEASED" = true ]; then tag="$NEW_TAG"; fi
          if [ -z "$tag" ]; then
            echo "::notice::No commit since the last release calls for a new one"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Not a version tag: $tag"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null ||
            { echo "::error::No such tag: $tag"; exit 1; }
          {
            echo "released=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: Linux executable and installer
    needs: meta
    if: needs.meta.outputs.released == 'true'
    # Pinned: the binary needs the glibc it was built with or newer, so an
    # older image runs on more distributions.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # The postgres extra puts psycopg, with its own libpq, in the bundle.
      - name: Install the project and PyInstaller
        run: |
          uv sync --extra postgres
          uv pip install pyinstaller

      - name: The tests pass before publishing
        run: uv run pytest -q

      - name: Build the executable
        run: uv run pyinstaller --clean --noconfirm packaging/pyinstaller/ic705suite.spec

      - name: The executable starts
        run: |
          dist/ic705suite --help >/dev/null
          test "$(dist/ic705suite --version)" = "ic705suite ${{ needs.meta.outputs.version }}"
          # The full screen with the simulator, in a terminal, for a few
          # seconds: it must still be running when the timeout stops it.
          set +e
          HOME="$RUNNER_TEMP/home" TERM=xterm-256color \
            timeout -s INT 10 script -qec "dist/ic705suite --sim" /dev/null >"$RUNNER_TEMP/screen.txt" 2>&1
          code=$?
          set -e
          if [ "$code" != 124 ] || grep -aq Traceback "$RUNNER_TEMP/screen.txt"; then
            cat "$RUNNER_TEMP/screen.txt"; exit 1
          fi

      # install.sh installs the executable it finds next to itself; the name
      # is what install.sh --upgrade looks for in SHA256SUMS.txt.
      - name: Pack the executable with the installer
        run: |
          bundle="ic705suite-${{ needs.meta.outputs.version }}-linux-x86_64"
          mkdir -p "$bundle" artifacts
          install -m 755 dist/ic705suite "$bundle/ic705suite"
          install -m 755 packaging/linux/install.sh "$bundle/install.sh"
          cp LICENSE README.md "$bundle/"
          tar -czf "artifacts/$bundle.tar.gz" "$bundle"
          cp dist/ic705suite artifacts/ic705suite-linux-x86_64
          cp packaging/linux/install.sh artifacts/ic705suite-install.sh

      - name: Install, check and uninstall
        run: |
          bundle="ic705suite-${{ needs.meta.outputs.version }}-linux-x86_64"
          prefix="$RUNNER_TEMP/prefix"
          tar -xzf "artifacts/$bundle.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$bundle/install.sh" --prefix "$prefix" --no-configure
          "$prefix/bin/ic705suite" --version
          "$RUNNER_TEMP/$bundle/install.sh" --prefix "$prefix" --status
          "$RUNNER_TEMP/$bundle/install.sh" --prefix "$prefix" --uninstall
          test ! -e "$prefix/bin/ic705suite"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: artifacts/*

  windows:
    name: Windows executable and installer
    needs: meta
    if: needs.meta.outputs.released == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install the project and PyInstaller
        run: |
          uv sync --extra postgres
          uv pip install pyinstaller

      - name: The tests pass before publishing
        run: uv run pytest -q

      - name: Build the executable
        run: uv run pyinstaller --clean --noconfirm packaging/pyinstaller/ic705suite.spec

      - name: The executable starts
        run: |
          dist/ic705suite.exe --help | Out-Null
          if ($LASTEXITCODE) { exit 1 }
          $version = dist/ic705suite.exe --version
          if ($version -ne "ic705suite ${{ needs.meta.outputs.version }}") { throw "version: $version" }
          # The server with the simulator for a few seconds, then Ctrl+Break: it must
          # stop by itself, cleanly (exit code 0).
          $env:APPDATA = "$env:RUNNER_TEMP\roaming"; $env:LOCALAPPDATA = "$env:RUNNER_TEMP\local"
          uv run python packaging/windows/smoke.py dist/ic705suite.exe

      - name: Pack the executable with the installer
        run: |
          $bundle = "ic705suite-${{ needs.meta.outputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Force $bundle, artifacts | Out-Null
          Copy-Item dist/ic705suite.exe, packaging/windows/install.ps1, LICENSE, README.md $bundle
          Compress-Archive -Path $bundle -DestinationPath "artifacts/$bundle.zip"
          Copy-Item dist/ic705suite.exe artifacts/ic705suite-windows-x86_64.exe
          Copy-Item packaging/windows/install.ps1 artifacts/ic705suite-install.ps1

      - name: Install, check and uninstall
        run: |
          $bundle = "ic705suite-${{ needs.meta.outputs.version }}-windows-x86_64"
          $dir = "$env:RUNNER_TEMP\programs"
          Expand-Archive "artifacts/$bundle.zip" $env:RUNNER_TEMP
          $installer = "$env:RUNNER_TEMP\$bundle\install.ps1"
          & $installer -InstallDir $dir -NoConfigure
          if ($LASTEXITCODE) { exit 1 }
          & "$dir\ic705suite.exe" --version
          & $installer -InstallDir $dir -Status
          if ($LASTEXITCODE) { exit 1 }
          & $installer -InstallDir $dir -Uninstall
          if ($LASTEXITCODE) { exit 1 }
          if (Test-Path "$dir\ic705suite.exe") { throw "still installed" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: artifacts/*

  python-package:
    name: Python package
    needs: meta
    if: needs.meta.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  publish:
    name: Publish the release
    needs: [meta, linux, windows, python-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a Sigstore signature of each file, tied to this
      # workflow run, that "gh attestation verify" checks.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Gather the files and their sums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Sign where the files come from
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: release/*

      # What changed (this version's part of CHANGELOG.md, as python-semantic-release
      # wrote it), then how to install.
      - name: Release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          awk -v head="## v$VERSION " 'index($0, head) == 1 { found = 1; next }
                                       found && /^## / { exit }
                                       found' CHANGELOG.md > notes.md
          { cat notes.md; echo; cat packaging/release-notes.md; } > body.md
          cat body.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          files: release/*
          body_path: body.md
