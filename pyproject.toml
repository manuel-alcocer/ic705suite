[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ic705suite"
dynamic = ["version"]
description = "Terminal station suite for the Icom IC-705 (and more rigs to come): dashboard, rig view, CW, D-STAR, logbook and packet"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Manuel Alcocer", email = "manuel@alcocer.net" }]
keywords = ["ham radio", "amateur radio", "ic-705", "cw", "d-star", "logbook", "packet", "tui"]
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
    "textual>=1.0",
    "websockets>=13",
    # The time zones of the logbook settings: Windows has no zone database.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/manuel-alcocer/ic705suite"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
metrics = ["prometheus-client>=0.20"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
gui = [
    "pyside6-essentials>=6.9",
    "qasync>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ic705suite = "ic705suite.cli:main"
ic705suite-replay = "ic705suite.apps.cw.replay:main"

[tool.hatch.version]
path = "src/ic705suite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ic705suite"]

# Releases: python-semantic-release, run by .github/workflows/release.yml once the tests pass
# on main. It reads the Conventional Commits since the last tag (feat: a minor version, fix: and
# perf: a patch, "!" or BREAKING CHANGE: a major one, a minor one while at 0.x), writes the
# version here and in CHANGELOG.md, commits, tags vX.Y.Z and pushes.
[tool.semantic_release]
version_variables = ["src/ic705suite/__init__.py:__version__"]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): {version}"
allow_zero_version = true
major_on_zero = false
build_command = ""                 # the release workflow builds, on Linux and Windows

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = ['chore\(release\):.*']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
