[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ic705suite"
dynamic = ["version"]
description = "Terminal station suite for the Icom IC-705 (and more rigs to come): dashboard, rig view, CW, D-STAR, logbook and packet"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Manuel Alcocer", email = "manuel@alcocer.net" }]
keywords = ["ham radio", "amateur radio", "ic-705", "cw", "d-star", "logbook", "packet", "tui"]
dependencies = [
    "mutagen>=1.47",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
    "textual>=1.0",
    "websockets>=13",
    # The time zones of the logbook settings: Windows has no zone database.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/manuel-alcocer/ic705suite"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
metrics = ["prometheus-client>=0.20"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ic705suite = "ic705suite.cli:main"
ic705suite-replay = "ic705suite.apps.cw.replay:main"

[tool.hatch.version]
path = "src/ic705suite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ic705suite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
